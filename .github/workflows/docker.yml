name: Build Docker image
# main에 올라가면 ghcr.io/<소유자>/dusk-cellar:latest(+커밋 해시)로, v* 태그면 그 버전으로 올린다. PR에서는 빌드만 해 본다.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["launcher/**", "HandOff/**", "**/*.md"]
  pull_request:
    paths-ignore: ["launcher/**", "HandOff/**", "**/*.md"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dusk-cellar
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
